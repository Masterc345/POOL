name: Build Android APK

# Builds an installable Android app (debug-signed APK) with Capacitor.
# Download it from the run's "Artifacts" section and copy it to the phone.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build the web game
        run: npm run build

      - name: Create the Android project
        run: npx cap add android

      - name: Customise (landscape, full screen, icons)
        run: node scripts/android-prepare.mjs

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PoolMaster3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PoolMaster3D-Android-APK
          path: PoolMaster3D.apk
          if-no-files-found: error

      - name: Attach APK to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PoolMaster3D.apk
