name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build installer (NSIS, x64)
        run: npm run dist:win

      - name: Verify installer exists
        shell: pwsh
        run: |
          if (-not (Test-Path release/PoolMaster3D-Setup.exe)) { Write-Error "Installer not found"; exit 1 }
          Get-Item release/PoolMaster3D-Setup.exe | Format-List Name, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoolMaster3D-Setup
          path: release/PoolMaster3D-Setup.exe
          if-no-files-found: error

      - name: Attach installer to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/PoolMaster3D-Setup.exe
